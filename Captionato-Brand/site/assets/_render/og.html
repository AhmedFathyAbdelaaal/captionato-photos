<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Courier+Prime:wght@400&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{width:1200px;height:630px;background:#f1e7d6;position:relative;overflow:hidden;
  background-image:radial-gradient(120% 120% at 12% 0%, rgba(255,255,255,.5), transparent 45%);}
.frame{position:absolute;inset:24px;border:3px solid #c6a24e;border-radius:26px}
.wrap{position:absolute;inset:0;display:flex;align-items:center;gap:64px;padding:0 100px}
.pin{width:310px;height:310px;flex:none;filter:drop-shadow(0 26px 32px rgba(20,17,16,.42))}
.copy h1{font-family:'Bricolage Grotesque',sans-serif;font-size:104px;font-weight:800;letter-spacing:-.05em;margin:0;color:#141110;line-height:.9}
.copy .motto{font-family:'Bricolage Grotesque',sans-serif;font-size:42px;font-weight:800;color:#d6362b;margin:20px 0 0;letter-spacing:-.02em}
.cat{position:absolute;left:100px;bottom:64px;font-family:'Courier Prime',monospace;font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:#6a584a}
</style></head>
<body>
<div class="frame"></div>
<div class="wrap">
  <img class="pin" src="../marks/capybara-pin.svg" alt="">
  <div class="copy"><h1>Captionato</h1><p class="motto">Stay soft. Ship sharp.</p></div>
</div>
<div class="cat">Brand Kit &middot; Edition 01</div>
</body></html>
