<!--
  CAPTIONATO EMAIL SIGNATURE  (CAP-SIG-01)
  How to use:
  1. Host the mark somewhere public (e.g. https://captionato.tech/brand/mark.png) and update the <img src> below.
     A ready 128px PNG is in assets/email-mark-128.png.
  2. Edit the name, role line, and links.
  3. Open this file in a browser, select the card, copy, and paste into your mail client's HTML signature editor.
  Email clients strip <style>/SVG, so everything here is inline styles + a raster <img> on purpose.
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;color:#141110">
  <tr>
    <td style="padding-right:16px;vertical-align:middle">
      <img src="https://captionato.tech/brand/mark.png" width="54" height="54" alt="Captionato"
           style="display:block;border-radius:12px;border:0" />
    </td>
    <td style="border-left:2px solid #c6a24e;padding-left:16px;vertical-align:middle">
      <div style="font-size:17px;font-weight:bold;color:#141110;letter-spacing:-0.2px">Your Name</div>
      <div style="font-size:13px;color:#9a6a45;padding:3px 0 7px">Captionato &nbsp;&middot;&nbsp; Stay soft. Ship sharp.</div>
      <div style="font-size:13px;color:#6a584a">
        <a href="https://captionato.tech" style="color:#d6362b;text-decoration:none;font-weight:bold">captionato.tech</a>
        <span style="color:#c9b79a">&nbsp;&middot;&nbsp;</span>
        <a href="mailto:you@captionato.tech" style="color:#6a584a;text-decoration:none">you@captionato.tech</a>
      </div>
    </td>
  </tr>
</table>
